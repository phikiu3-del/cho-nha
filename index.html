}

  --brand-fg:#06140f; --income:#4cd17f; --expense:#ff6b5e; --income-soft:#13301f; --expense-soft:#3a1714; --warn:#f0b75a; --warn-soft:#3a2f18;
  --c1:#36a383; --c2:#b8800f; --c3:#6f8de0; --c4:#d8648a; --c5:#9a78e0; --c6:#7f9f2f; --grid:#2c2c2e;
  --tabbar:rgba(22,22,24,.86); --sheet:#0f0f11; --seg-on:#5a5a5f; --prev:#55555b; --card-shadow:none; --shadow:0 10px 40px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{

  --c1:#36a383; --c2:#b8800f; --c3:#6f8de0; --c4:#d8648a; --c5:#9a78e0; --c6:#7f9f2f; --grid:#2c2c2e;

.av-btns{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}.av-btns label,.av-btns button{display:flex;align-items:center;justify-content:center;gap:6px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:15px;border:0;cursor:pointer}.av-btns .rm{background:none;color:var(--expense);height:28px;font-weight:600}

function genOrders(){
  let r=11;const rnd=()=>(r=(r*16807)%2147483647)/2147483647;

    const hNow=(Date.now()-d0)/H;for(let k=0;k<n;k++){const at=d===0?(hNow<7?Infinity:d0+(6.5+rnd()*(hNow-6.6))*H):d0-d*D+(7+rnd()*13)*H;if(at>Date.now())continue;
      const items=[],m=d>34?1+Math.floor(rnd()*2):1+Math.floor(rnd()*3);

function vietqr(amount,note){
  const t=(id,v)=>id+String(v.length).padStart(2,'0')+v;
  const info=norm(note||'').toUpperCase().replace(/[^A-Z0-9 ]/g,'').slice(0,25);
  const s=t('00','01')+t('01',amount?'12':'11')+t('38',t('00','A000000727')+t('01',t('00',settings.bin)+t('01',settings.acc.replace(/\s/g,'')))+t('02','QRIBFTTA'))+t('53','704')+(amount?t('54',String(Math.round(amount))):'')+t('58','VN')+(info?t('62',t('08',info)):'')+'6304';
  return s+crc16(s);
}

const isoD=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

function oRange(){const d=new Date(st.oAt);
  if(st.op==='day'){const a=new Date(d.getFullYear(),d.getMonth(),d.getDate());return [a.getTime(),new Date(a.getFullYear(),a.getMonth(),a.getDate()+1).getTime()]}

  if(st.op==='month')return [new Date(d.getFullYear(),d.getMonth(),1).getTime(),new Date(d.getFullYear(),d.getMonth()+1,1).getTime()];
  if(st.op==='custom'){let a=st.oFrom||dayStart(),b=st.oTo||dayStart();if(a>b)[a,b]=[b,a];const e=new Date(b);return [a,new Date(e.getFullYear(),e.getMonth(),e.getDate()+1).getTime()]}
  return [0,Infinity]}
function oLabel(a,b){const f=t=>{const d=new Date(t);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')};

function allEntries(){
  const e=cash.map(x=>({...x,manual:true}));
  orders.forEach(o=>{if(o.status==='done'&&!o.debtPaid)e.push({at:o.at,type:'in',cat:'Bán hàng',amount:orderTotal(o),note:`${o.id} · ${C(o.cid)?.name||o.name}`})});
  debtPays.forEach(p=>e.push({at:p.at,type:'in',cat:'Thu nợ',amount:p.amount,note:C(p.cid)?.name||''}));
  moves.filter(m=>(m.qty>0||(isFix(m)&&m.qty))&&m.cost>0).forEach(m=>e.push({at:m.at,type:'out',cat:'Nhập hàng',amount:m.qty*(m.cost||0),fix:isFix(m),mkey:m.at+'_'+m.pid,note:isFix(m)?`${P(m.pid)?.name||''} ${m.qty<0?'bớt '+(-m.qty):'thêm '+m.qty} · ${m.qty<0?'trừ':'cộng'} tiền nhập`:`${P(m.pid)?.name||''} × ${m.qty}`}));
  return e.sort((a,b)=>b.at-a.at);
}

function revBars(days,label){const max=Math.max(1,...days.map(d=>d.rev)),step=niceStep(max),top=Math.ceil(max/step)*step,R=days.length;
  const W=420,Hh=190,L=40,B=22,Tp=8,cw=(W-L)/R,bw=Math.min(28,cw*.62),y=v=>Tp+(Hh-Tp-B)*(1-v/top);

  for(let v=0;v<=top+1e-6;v+=step)svg+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-5}" y="${y(v)+4}" text-anchor="end">${short(v)}</text>`;

function openMove(key){const m=moves.find(x=>x.at+'_'+x.pid===key);if(!m)return;const p=P(m.pid),fix=isFix(m),neg=m.qty<0,inn=m.qty>0&&!fix;sheetMode='move';
  const draw=()=>{openSheet(fix?'Sửa tồn kho':inn?'Phiếu nhập kho':'Phiếu xuất kho',`<div style="display:flex;flex-direction:column;align-items:center;gap:6px">${p?photoBox(p):''}<b>${esc(p?.name||'Đã xóa')}</b><span class="hint">${new Date(m.at).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit',year:'numeric'})}${p&&!p.service?` · Tồn ${p.stock}`:''}</span></div>

    ${!inn&&!fix?`<div class="field"><label>Lý do</label><div class="chips wrap-chips">${OUT_REASONS.concat(OUT_REASONS.includes(m.reason)||!m.reason?[]:[m.reason]).map(r=>`<button type="button" class="chip sm" data-mvr="${esc(r)}" aria-pressed="${r===(m.reason||OUT_REASONS[0])}">${esc(r)}</button>`).join('')}</div></div>`:''}`,

    let reason=m.reason||OUT_REASONS[0];document.querySelectorAll('[data-mvr]').forEach(b=>b.onclick=()=>{reason=b.dataset.mvr;document.querySelectorAll('[data-mvr]').forEach(x=>x.setAttribute('aria-pressed',x===b))});

      save();closeSheet();keepScroll(render);toast('Đã lưu phiếu')};

  draw()}

function deleteProduct(ex){
  const nOrd=orders.filter(o=>o.items.some(i=>i.id===ex.id)).length,nMov=moves.filter(m=>m.pid===ex.id).length;
  const drop=all=>{products=products.filter(x=>x!==ex);delete cart[ex.id];
    if(all){orders.forEach(o=>{o.items=o.items.filter(i=>i.id!==ex.id)});orders=orders.filter(o=>o.items.length);moves=moves.filter(m=>m.pid!==ex.id)}
    save();closeSheet();render();renderBill();toast(all?`Đã xóa ${ex.name} và lịch sử bán`:`Đã xóa ${ex.name}`)};
  if(!nOrd&&!nMov){confirmSheet(`Xóa “${esc(ex.name)}”?`,'Xóa',()=>drop(false));return}
  sheetMode='pdel';openSheet('Xóa sản phẩm',`<p style="margin:8px 4px;font-size:17px">“${esc(ex.name)}” đã có ${nOrd} đơn bán${nMov?` và ${nMov} lần nhập xuất`:''}.</p>
   <div class="group"><button class="cell" id="pdAll"><span class="ic" style="background:color-mix(in srgb,var(--expense) 14%,transparent)">🗑️</span><span class="grow"><span class="t exp" style="display:block">Xóa cả lịch sử bán</span><span class="s" style="display:block">Doanh thu, lời lỗ, đơn hàng của món này cũng mất</span></span></button>
   <button class="cell" id="pdOnly"><span class="ic" style="background:var(--brand-soft)">📦</span><span class="grow"><span class="t" style="display:block">Chỉ xóa sản phẩm</span><span class="s" style="display:block">Giữ lại các đơn đã bán trong báo cáo</span></span></button></div>`,`<button class="btn ghost" data-close>Hủy</button>`);
  $('#pdAll').onclick=()=>drop(true);$('#pdOnly').onclick=()=>drop(false)}
function deleteOrder(o){confirmSheet(`Xóa đơn ${o.id} (${fmt(orderTotal(o))})? Số lượng hàng sẽ được trả lại kho.`,'Xóa đơn',()=>{
  o.items.forEach(i=>{const p=P(i.id);if(p){if(!p.service)p.stock+=i.qty;p.sold=Math.max(0,(p.sold||0)-i.qty)}});
  orders=orders.filter(x=>x!==o);save();render();renderBill();toast('Đã xóa đơn '+o.id)})}
function confirmSheet(text,label,fn){sheetMode='confirm';openSheet('Xác nhận',`<p style="margin:8px 4px;font-size:17px">${text}</p>`,`<div class="row"><button class="btn ghost" data-close style="flex:1">Hủy</button><button class="btn danger" id="cfOk" style="flex:1">${label}</button></div>`);$('#cfOk').onclick=()=>{closeSheet();fn()}}

const UNITS=['cái','kg','gói','hộp','chai','lon','thùng','bó','phần','lượt'];
function squareImg(file,m,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sz=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=Math.min(m,sz);c.getContext('2d').drawImage(im,(im.width-sz)/2,(im.height-sz)/2,sz,sz,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.85))};im.onerror=()=>toast('Không đọc được ảnh này');im.src=r.result};r.readAsDataURL(file)}
function resizeImg(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=320,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};im.onerror=()=>toast('Không đọc được ảnh này');im.src=r.result};r.readAsDataURL(file)}
const money=v=>v?Number(v).toLocaleString('vi-VN'):'';
const unmoney=v=>+String(v).replace(/\D/g,'')||0;
function openEditor(id,pre){
  const ex=id?P(id):null;sheetMode='edit';
  const f=ex?{code:'',...ex}:{name:'',code:'',cat:st.cat!=='Tất cả'?st.cat:(pcats[0]?.name||''),emoji:'',img:'',price:0,cost:0,old:0,unit:'cái',stock:1,desc:'',service:false,...(pre||{})};
  const sync=()=>{f.name=$('#p-name').value;f.code=$('#p-code').value.trim();f.price=unmoney($('#p-price').value);f.cost=unmoney($('#p-cost').value);f.old=unmoney($('#p-old').value);f.stock=Math.max(0,+$('#p-stock').value||0);f.desc=$('#p-desc').value;f.unit=$('#p-unit').value.trim()||'cái';f.service=$('#p-svc').checked;f.emoji=$('#p-emoji').value.trim()};

     <div class="ph-btns"><label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Chụp ảnh<input type="file" accept="image/*" capture="environment" class="p-file" hidden></label><label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/></svg>Chọn từ máy<input type="file" accept="image/*" class="p-file" hidden></label></div>
     ${f.img?`<button class="link" id="imgDel" style="align-self:center;margin-top:-8px;color:var(--expense)">Bỏ ảnh</button>`:''}
     <div class="group form-list">
      <label class="frow"><span>Tên</span><input id="p-name" value="${esc(f.name)}" placeholder="Tên sản phẩm" autocomplete="off"></label>
      <label class="frow"><span>Giá nhập</span><input id="p-cost" inputmode="numeric" value="${money(f.cost)}" placeholder="0" class="num money"><i>₫</i></label>
      <label class="frow"><span>Giá bán</span><input id="p-price" inputmode="numeric" value="${money(f.price)}" placeholder="0" class="num money"><i>₫</i></label>
      <div class="frow"><span>Mã vạch</span><input id="p-code" value="${esc(f.code||'')}" placeholder="—" inputmode="numeric" autocomplete="off" style="text-align:right"><button type="button" class="scan-btn" id="p-scan" aria-label="Quét mã vạch">${SCAN_IC}</button></div>
     </div>
     <div class="hint" id="margin" style="margin:-8px 4px 0"></div>
     <div class="group-h">Danh mục</div>
     <div class="chips wrap-chips">${pcats.map(c=>`<button type="button" class="chip" data-pcat="${esc(c.name)}" aria-pressed="${c.name===f.cat}" style="${c.name===f.cat?`background:${c.color};color:#fff`:''}">${c.icon} ${esc(c.name)}</button>`).join('')}<button type="button" class="chip" data-pcatnew style="color:var(--brand)">＋ ${pcats.length?'Mới':'Tạo danh mục'}</button>${f.cat?`<button type="button" class="chip sm" data-pcat="" style="color:var(--muted)">Bỏ chọn</button>`:''}</div>
     <div class="group form-list">
      <label class="frow switch-row"><span>Dịch vụ, không tính tồn kho</span><input type="checkbox" id="p-svc" class="switch" ${f.service?'checked':''}></label>
      <div class="frow" id="stockRow" ${f.service?'hidden':''}><span>Số lượng</span><div class="stepper"><button type="button" id="stDec">−</button><input id="p-stock" inputmode="numeric" value="${f.stock}" class="num" style="width:56px;text-align:center;border:0;background:none;font-weight:700"><button type="button" id="stInc">+</button></div></div>

     <details class="more-opts" ${f.old||f.desc||f.emoji?'open':''}><summary>Tùy chọn thêm</summary>
      <div class="group form-list">
       <label class="frow"><span>Giá gốc (gạch ngang)</span><input id="p-old" inputmode="numeric" value="${money(f.old)}" placeholder="Không có" class="num money"><i>₫</i></label>
       <label class="frow"><span>Biểu tượng khi không có ảnh</span><input id="p-emoji" value="${esc(f.emoji)}" maxlength="4" placeholder="${cat?.icon||'🛒'}" style="text-align:right;width:60px"></label>
       <label class="frow"><span>Mô tả</span><input id="p-desc" value="${esc(f.desc||'')}" placeholder="Không bắt buộc"></label>
      </div></details>`,
     `<div class="row">${ex?'<button class="btn danger" id="pDel">Xóa</button>':''}<button class="btn" id="pSave" style="flex:1">${ex?'Lưu thay đổi':'Thêm sản phẩm'}</button></div>`,
     ex?'':`<button class="link" id="pSaveTop">Lưu</button>`);
    let mg=()=>{const pr=unmoney($('#p-price').value),co=unmoney($('#p-cost').value);const u=esc($('#p-unit').value||'cái');$('#margin').innerHTML=pr&&co?(pr>=co?`Bán 1 ${u} lời <b class="inc num">${fmt(pr-co)}</b> (${Math.round((pr-co)/pr*100)}%)`:`Bán 1 ${u} <b class="exp">lỗ ${fmt(co-pr)}</b>`):''};
    const bl=()=>{const co=unmoney($('#p-cost').value),q=Math.max(0,+$('#p-stock').value||0),u=esc($('#p-unit').value||'cái'),add=ex?q-Math.max(0,ex.stock):q;
      $('#buyline').innerHTML=!$('#p-svc').checked&&co&&add>0?`Tiền nhập: ${add} ${u} × ${fmt(co)} = <b class="exp num">${fmt(add*co)}</b>`:''};
    const mg0=mg;mg=()=>{mg0();bl()};mg();
    $('#p-stock').oninput=mg;$('#p-unit').oninput=mg;
    $('#p-scan').onclick=()=>{sync();openScanner(c=>{f.code=c;draw();toast('Đã lấy mã '+c)},'Quét mã vạch sản phẩm',false,()=>draw())};
    document.querySelectorAll('#sheetBody .money').forEach(i=>i.oninput=()=>{const v=unmoney(i.value);i.value=money(v);mg()});
    document.querySelectorAll('#p-img,.p-file').forEach(inp=>inp.onchange=e=>{const file=e.target.files[0];if(file){sync();toast('Đang xử lý ảnh…');resizeImg(file,u=>{f.img=u;draw()})}});
    if($('#imgDel'))$('#imgDel').onclick=()=>{sync();f.img='';draw()};
    document.querySelectorAll('[data-pcat]').forEach(b=>b.onclick=()=>{sync();f.cat=b.dataset.pcat;draw()});
    $('[data-pcatnew]').onclick=()=>{sync();openCatEditor('p',null,n=>{if(n)f.cat=n;draw()})};
    document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{sync();f.unit=b.dataset.unit;draw()});
    $('#p-svc').onchange=()=>{$('#stockRow').hidden=$('#p-svc').checked;mg()};
    $('#stDec').onclick=()=>{$('#p-stock').value=Math.max(0,(+$('#p-stock').value||0)-1);mg()};
    $('#stInc').onclick=()=>{$('#p-stock').value=(+$('#p-stock').value||0)+1;mg()};
    const doSave=()=>{sync();
      if(!f.name.trim()){toast('Nhập tên sản phẩm');$('#p-name').focus();return}
      if(!(f.price>0)){toast('Nhập giá bán');$('#p-price').focus();return}
      if(f.code&&products.some(x=>x!==ex&&x.code===f.code)){toast('Mã vạch này đã dùng cho sản phẩm khác');return}
      const d={code:f.code||undefined,name:f.name.trim(),emoji:f.emoji||PC(f.cat)?.icon||'🛒',img:f.img||'',cat:f.cat,price:f.price,cost:f.cost,old:f.old>f.price?f.old:undefined,stock:f.service?0:f.stock,unit:f.unit,desc:f.desc.trim(),service:f.service};
      if(ex){const diff=d.service?0:d.stock-Math.max(0,ex.stock);
        if(d.cost!==ex.cost)moves.forEach(m=>{if(m.pid===ex.id&&m.auto)m.cost=d.cost});
        Object.assign(ex,d);
        if(diff>0&&d.cost>0)moves.push({at:Date.now(),pid:ex.id,qty:diff,cost:d.cost});
        if(diff<0){let left=-diff;moves.filter(m=>m.pid===ex.id&&m.qty>0).sort((a,b)=>b.at-a.at).forEach(m=>{const t=Math.min(left,m.qty);m.qty-=t;left-=t});moves=moves.filter(m=>m.qty!==0)}}else{const nid=uid();products.unshift({id:nid,sold:0,...d});if(!d.service&&d.stock>0&&d.cost>0)moves.push({at:Date.now(),pid:nid,qty:d.stock,cost:d.cost})}
      if(!save()){toast('Bộ nhớ đầy, thử ảnh nhỏ hơn hoặc bỏ bớt ảnh');return}
      closeSheet();render();renderBill();toast(ex?'Đã lưu thay đổi':'Đã thêm '+d.name)};
    $('#pSave').onclick=doSave;if($('#pSaveTop'))$('#pSaveTop').onclick=doSave;
    if(ex)$('#pDel').onclick=()=>deleteProduct(ex);
  };draw();
}

const rangeSeg=()=>`<div class="seg">${[[7,'7 ngày'],[30,'30 ngày'],['year','Theo năm']].map(([r,l])=>`<button data-range="${r}" aria-pressed="${r===st.range}">${l}</button>`).join('')}</div>`;
function rYear(){
  const Y=st.year||new Date().getFullYear();st.year=Y;
  const agg=y=>[...Array(12)].map((_,m)=>{const a=new Date(y,m,1).getTime(),b=new Date(y,m+1,1).getTime(),os=orders.filter(o=>o.at>=a&&o.at<b&&o.status!=='cancel');const rev=os.reduce((s,o)=>s+orderTotal(o),0);
    const exp=cash.filter(e=>e.type==='out'&&e.at>=a&&e.at<b).reduce((s,e)=>s+e.amount,0)+lossIn(a,b);return{m,rev,gross:rev-os.reduce((s,o)=>s+orderCost(o),0),exp,n:os.length,future:a>Date.now()}});
  const cur=agg(Y),prev=agg(Y-1),sum=(a,k)=>a.reduce((s,x)=>s+x[k],0);
  const rev=sum(cur,'rev'),prevRev=sum(prev.filter((_,i)=>!cur[i].future),'rev'),gross=sum(cur,'gross'),exp=sum(cur,'exp');
  const diff=prevRev?Math.round((rev-prevRev)/prevRev*100):null;
  const max=Math.max(1,...cur.map(x=>x.rev),...prev.map(x=>x.rev)),step=niceStep(max),top=Math.ceil(max/step)*step;
  const W=420,Hh=210,L=36,B=22,Tp=8,cw=(W-L)/12,bw=Math.min(12,cw*.32),y=v=>Tp+(Hh-Tp-B)*(1-v/top);
  let svg=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Doanh thu 12 tháng năm ${Y} so với ${Y-1}">`;
  for(let v=0;v<=top;v+=step)svg+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-5}" y="${y(v)+4}" text-anchor="end">${short(v)}</text>`;
  const bar=(x,v,cls)=>{const h=y(0)-y(v),r=Math.min(4,h,bw/2);return h>0?`<path class="${cls}" pointer-events="none" d="M${x},${y(0)} v${-(h-r)} q0,${-r} ${r},${-r} h${bw-2*r} q${r},0 ${r},${r} v${h-r} z"/>`:''};
  cur.forEach((c,i)=>{const x0=L+i*cw,cx=x0+cw/2;
    svg+=`<rect x="${x0}" y="${Tp}" width="${cw}" height="${Hh-Tp-B}" fill="transparent" data-tip="Tháng ${i+1}: ${fmt(c.rev)} · năm trước ${fmt(prev[i].rev)}"/>`;
    svg+=bar(cx-bw-1,prev[i].rev,'bar prev')+bar(cx+1,c.rev,'bar');
    svg+=`<text x="${cx}" y="${Hh-5}" text-anchor="middle">T${i+1}</text>`});
  svg+='</svg>';
  const best=cur.reduce((a,b)=>b.rev>a.rev?b:a,cur[0]);
  return `${rangeSeg()}
  <div class="month"><button data-year="-1" aria-label="Năm trước">‹</button><strong>Năm ${Y}</strong><button data-year="1" aria-label="Năm sau" ${Y>=new Date().getFullYear()?'disabled style="opacity:.3"':''}>›</button></div>
  <div class="tiles"><div class="tile"><div class="k">Doanh thu năm</div><div class="v big num">${fmt(rev)}</div>${diff!==null?`<div class="${diff>=0?'inc':'exp'}" style="font-size:13px;font-weight:600">${diff>=0?'▲':'▼'} ${Math.abs(diff)}% so với ${Y-1}</div>`:''}</div><div class="tile"><div class="k">Tiền nhập hàng</div><div class="v big num exp">${fmt(buyIn(new Date(Y,0,1).getTime(),new Date(Y+1,0,1).getTime()))}</div></div><div class="tile"><div class="k">Lời bán hàng</div><div class="v big num inc">${fmt(gross)}</div></div><div class="tile"><div class="k">Chi phí khác</div><div class="v big num exp">${fmt(exp)}</div></div><div class="tile" style="grid-column:1/-1"><div class="k">Lời thực</div><div class="v big num ${gross-exp>=0?'inc':'exp'}">${fmt(gross-exp)}</div></div></div>
  <div class="panel"><div class="row"><h3>Doanh thu 12 tháng</h3></div>
   <div class="legend" style="flex-direction:row;gap:16px"><div><span class="sw" style="background:var(--brand)"></span>${Y}</div><div><span class="sw" style="background:var(--prev)"></span>${Y-1}</div></div>
   <div class="chart">${svg}</div>${best.rev?`<span class="hint">Tháng bán tốt nhất: tháng ${best.m+1}, ${fmt(best.rev)}</span>`:''}</div>
  <div class="group-h">Chi tiết từng tháng</div>
  <div class="group">${cur.filter(c=>!c.future).reverse().map(c=>`<div class="cell"><div class="grow"><div class="t">Tháng ${c.m+1}</div><div class="s">${c.n} đơn · lãi gộp ${fmt(c.gross)} · chi ${fmt(c.exp)}</div></div><div class="r"><div class="big num">${fmt(c.rev)}</div>${prev[c.m].rev?`<div class="s ${c.rev>=prev[c.m].rev?'inc':'exp'}">${c.rev>=prev[c.m].rev?'▲':'▼'} ${Math.abs(Math.round((c.rev-prev[c.m].rev)/prev[c.m].rev*100))}%</div>`:''}</div></div>`).join('')}</div>`;
}

/* ---------- category manager ---------- */
const KIND={p:'Danh mục sản phẩm',in:'Hạng mục thu',out:'Hạng mục chi'};
function catList(kind){return kind==='p'?pcats:ccats.filter(c=>c.type===kind)}
function catUse(kind,c){return kind==='p'?products.filter(p=>p.cat===c.name).length:allEntries().filter(e=>e.cat===c.name&&(!c.type||e.type===c.type)).length}
function openCatList(kind){
  sheetMode='catlist';
  openSheet(kind==='p'?'Danh mục sản phẩm':'Hạng mục thu chi',`
   ${kind==='p'?'':`<div class="seg"><button data-mgr="out" aria-pressed="${kind==='out'}">Tiền chi</button><button data-mgr="in" aria-pressed="${kind==='in'}">Tiền thu</button></div>`}
   <div class="group">${catList(kind).map(c=>`<button class="cell" data-catedit="${c.id}" data-kind="${kind}">${icBox(c)}<span class="grow"><span class="t" style="display:block">${esc(c.name)}</span><span class="s" style="display:block">${c.sys?'Tự động · ':''}${catUse(kind,c)} ${kind==='p'?'sản phẩm':'khoản'}</span></span><span class="sw" style="background:${c.color};width:14px;height:14px;border-radius:50%"></span>${CHEV}</button>`).join('')||'<div class="empty">Chưa có danh mục nào</div>'}</div>
   `,
   `<button class="btn" data-catnew="${kind}">＋ Thêm ${kind==='p'?'danh mục':'hạng mục'}</button>`);
}
function openCatPick(name){sheetMode='catpick';const q=norm(name);
  const sel=new Set(products.filter(p=>p.cat===name||(!p.cat&&norm(p.name).includes(q))).map(p=>p.id));
  const list=[...products].sort((a,b)=>(sel.has(b.id)-sel.has(a.id))||a.name.localeCompare(b.name,'vi'));
  const draw=()=>{openSheet(name,`<div class="row" style="margin:0 4px"><span class="hint" id="cpN">Đã chọn ${sel.size}</span><button class="link" id="cpAll" style="font-size:15px">${sel.size===products.length?'Bỏ chọn hết':'Chọn tất cả'}</button></div>
    <div class="group">${list.map(p=>`<label class="cell" style="gap:12px"><div class="em" style="${tint(p)}">${pic(p)}</div><span class="grow"><span class="t" style="display:block">${esc(p.name)}</span>${p.cat&&p.cat!==name?`<span class="s" style="display:block">${esc(p.cat)}</span>`:''}</span><input type="checkbox" class="cp" data-id="${p.id}" ${sel.has(p.id)?'checked':''} style="width:24px;height:24px;accent-color:var(--brand)"></label>`).join('')}</div>`,
    `<button class="btn" id="cpSave" style="width:100%">Lưu</button>`);
    document.querySelectorAll('#sheetBody .cp').forEach(c=>c.onchange=()=>{const id=+c.dataset.id;c.checked?sel.add(id):sel.delete(id);$('#cpN').textContent='Đã chọn '+sel.size;$('#cpAll').textContent=sel.size===products.length?'Bỏ chọn hết':'Chọn tất cả'});
    $('#cpAll').onclick=()=>{if(sel.size===products.length)sel.clear();else products.forEach(p=>sel.add(p.id));draw()};
    $('#cpSave').onclick=()=>{let n=0;products.forEach(p=>{if(sel.has(p.id)){if(p.cat!==name){p.cat=name;n++}}else if(p.cat===name){p.cat='';n++}});save();closeSheet();keepScroll(render);toast(`Danh mục ${name}: ${sel.size} sản phẩm`)}};
  draw()}
function openCatEditor(kind,id,done){
  const list=kind==='p'?pcats:ccats,ex=id?list.find(c=>c.id===id):null;
  let name=ex?.name||'',icon=ex?.icon||ICONS[0],color=ex?.color||COLORS[catList(kind).length%COLORS.length];
  const back=done||(()=>openCatList(kind));sheetMode='catedit';
  const draw=()=>{
    openSheet(ex?'Sửa '+(kind==='p'?'danh mục':'hạng mục'):(kind==='p'?'Danh mục mới':KIND[kind]+' mới'),`
     <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><span class="ic" id="cePrev" style="width:76px;height:76px;font-size:40px;border-radius:22px;background:${soft(color)};box-shadow:inset 0 0 0 2px ${color}">${icon}</span></div>
     <div class="field"><label for="cat-name">Tên</label><input id="cat-name" value="${esc(name)}" ${ex?.sys?'disabled':''} placeholder="${kind==='p'?'Ví dụ: Bia rượu':'Ví dụ: Quảng cáo'}"><span class="msg"></span></div>
     <div class="group-h">Màu sắc</div><div class="group"><div class="swatches">${COLORS.map(c=>`<button data-col="${c}" aria-pressed="${c===color}" aria-label="Màu ${c}" style="background:${c}"></button>`).join('')}</div></div>
     <div class="group-h">Biểu tượng</div><div class="icon-grid">${ICONS.map(i=>`<button data-ico="${i}" aria-pressed="${i===icon}">${i}</button>`).join('')}</div>`,
     `<div class="row">${ex&&!ex.sys?'<button class="btn danger" id="catDel">Xóa</button>':''}<button class="btn" id="catSave" style="flex:1">Lưu</button></div>`,'');
    $('#sheetLeft').textContent='Quay lại';sheetBack=()=>back();
    $('#sheetBody').querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{name=$('#cat-name').value;color=b.dataset.col;draw()});
    $('#sheetBody').querySelectorAll('[data-ico]').forEach(b=>b.onclick=()=>{name=$('#cat-name').value;icon=b.dataset.ico;draw()});
    $('#catSave').onclick=()=>{
      const n=$('#cat-name').value.trim();
      if(!setErr('cat-name',n?'':'Nhập tên'))return;
      if(list.some(c=>c!==ex&&norm(c.name)===norm(n)&&(kind==='p'||c.type===kind))){setErr('cat-name','Tên này đã có');return}
      if(ex){const old=ex.name;Object.assign(ex,{name:ex.sys?old:n,icon,color});
        if(!ex.sys&&old!==n){if(kind==='p'){products.forEach(p=>{if(p.cat===old)p.cat=n});if(st.cat===old)st.cat=n}else cash.forEach(e=>{if(e.cat===old)e.cat=n})}}
      else list.push(kind==='p'?{id:'p'+Date.now(),name:n,icon,color}:{id:'c'+Date.now(),type:kind,name:n,icon,color});
      save();render();if(kind==='p'&&!ex&&!done){st.cat=n;if(location.hash.slice(1)!=='')location.hash='';render();if(products.length)openCatPick(n);else openEditor(null);return}toast('Đã lưu');back(n)};
    if(ex&&!ex.sys)$('#catDel').onclick=()=>{
      const used=catUse(kind,ex);
      if(kind==='p'&&used){toast(`Còn ${used} sản phẩm trong danh mục này. Chuyển chúng sang danh mục khác trước.`);return}
      confirmSheet(`Xóa “${esc(ex.name)}”?${used?` ${used} khoản cũ vẫn giữ tên này.`:''}`,'Xóa',()=>{if(kind==='p'){pcats=pcats.filter(c=>c!==ex);if(st.cat===ex.name)st.cat='Tất cả'}else ccats=ccats.filter(c=>c!==ex);save();render();openCatList(kind)})};
  };draw();
}

/* ---------- routing ---------- */
const VIEWS={shop:['Bán hàng',vShop],orders:['Đơn hàng',vOrders],customers:['Khách hàng',vCustomers],cashbook:['Thu chi',vCash],report:['Báo cáo',vReport],settings:['Cài đặt',()=>`<div class="view">${rSettings()}</div>`]};
function render(){
  const [title,fn]=VIEWS[st.view];
  $('#viewTitle').textContent=title;
  $('#searchBox').hidden=!['shop','orders','customers'].includes(st.view);
  $('#q').placeholder={shop:'Tìm sản phẩm, dịch vụ',orders:'Tìm mã đơn, tên khách',customers:'Tìm tên, số điện thoại'}[st.view]||'';
  const t=totals();
  const GEAR=st.view==='settings'?'':`<button class="circle" data-go="settings" aria-label="Cài đặt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>`;
  $('#topActions').innerHTML=GEAR+(st.view==='shop'?`<button class="circle" data-scan aria-label="Quét mã vạch">${SCAN_IC}</button><button class="circle" data-newprod aria-label="Thêm sản phẩm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button><button class="circle" data-bill aria-label="Đơn đang tạo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>${t.count?`<span class="badge num">${t.count}</span>`:''}</button>`
    :st.view==='customers'?`<button class="circle" data-newcust aria-label="Thêm khách hàng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button>`:'');
  $('#app').innerHTML=fn();
  $('#fab').hidden=!(st.view==='report'&&st.rtab==='overview');
  document.querySelectorAll('#tabbar a').forEach(a=>a.setAttribute('aria-current',a.dataset.v===st.view?'page':'false'));
  if(st.view==='report'||st.view==='settings')bindReport();
  drawQRs($('#app'));
}
function route(){let h=location.hash.slice(1);if(h==='cashbook'){st.rtab='overview';history.replaceState(null,'','#report');h='report'}const v=VIEWS[h]?h:'shop';if(v!==st.view){st.view=v;st.q='';$('#q').value=''}render();renderBill();scrollTo(0,0)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-year],[data-thm],[data-delorder],[data-scan],[data-share],[data-promoedit],[data-smode],[data-oreason],[data-mgr],[data-catedit],[data-catnew],[data-cat],[data-add],[data-inc],[data-dec],[data-open],[data-close],[data-edit],[data-bill],[data-of],[data-order],[data-setst],[data-cust],[data-newcust],[data-editcust],[data-mon],[data-day],[data-cashedit],[data-rt],[data-range],[data-accent],[data-pp],[data-pnav],[data-hist],[data-inhist],[data-cmon],[data-pmonth],[data-catpick],[data-mv],[data-mvall],[data-stk],[data-op],[data-onav],[data-style],[data-newprod],[data-restock],[data-kf],[data-kmv],[data-go]');
  if(!t)return;const d=t.dataset;
  if(d.mgr)openCatList(d.mgr);
  else if(d.catedit)openCatEditor(d.kind,d.catedit);
  else if(d.catnew)openCatEditor(d.catnew,null);
  else if(d.cat){st.cat=d.cat;keepScroll(render)}
  else if('catpick' in d){openCatPick(st.cat)}
  else if(d.add){const p=P(+d.add);if(!p.service&&p.stock<=0){toast('Sản phẩm đã hết hàng. Vào Kho hàng để nhập thêm.');return}setQty(+d.add,(cart[d.add]||0)+1);t.closest('.card')?.animate?.([{transform:'scale(.96)'},{transform:'scale(1)'}],{duration:180})}
  else if(d.inc)setQty(+d.inc,(cart[d.inc]||0)+1);
  else if(d.dec)setQty(+d.dec,(cart[d.dec]||0)-1);
  else if(d.open)openProduct(+d.open);
  else if('close' in d)closeSheet();
  else if(d.edit)openEditor(+d.edit);
  else if('bill' in d)openBill();
  else if(d.of){st.ofilter=d.of;render()}
  else if(d.setst){const o=orders.find(x=>x.id===d.oid);o.status=d.setst;if(d.setst!=='new')o.debtPaid=false;save();keepScroll(render);openOrder(o.id);toast(`${o.id}: ${STATUS[o.status][0]}`)}
  else if(d.order)openOrder(d.order);
  else if(d.cust)openCustomer(+d.cust);
  else if('newcust' in d)openCustomer(null);
  else if(d.editcust){const c=C(+d.editcust);sheetMode='custedit';openSheet('Sửa khách hàng',custForm(c),`<button class="btn" id="saveCust">Lưu</button>`);bindCustForm(c.id)}
  else if(d.mon){const m=new Date(st.month);m.setMonth(m.getMonth()+ +d.mon);st.month=m.getTime();st.day=Math.min(dayStart(),st.month);render()}
  else if(d.day){st.day=+d.day;if(st.view==='report'){st.pp='day';st.pAt=+d.day;render();scrollTo(0,0)}else keepScroll(render)}
  else if(d.cashedit)openCashEntry(d.cashedit);
  else if(d.rt){st.rtab=d.rt;try{localStorage.setItem('chonha4_ui_rtab',d.rt)}catch(e){}render()}
  else if(d.range){st.range=d.range==='year'?'year':+d.range;keepScroll(render)}
  else if(d.year){st.year=(st.year||new Date().getFullYear())+ +d.year;keepScroll(render)}
  else if(d.delorder){const o=orders.find(x=>x.id===d.delorder);if(o)deleteOrder(o)}
  else if(d.share){openInvoice(d.share)}
  else if(d.promoedit!==undefined){openPromo(+d.promoedit||null)}
  else if(d.smode){st.smode=d.smode;keepScroll(render)}
  else if(d.oreason){st.oreason=d.oreason;document.querySelectorAll('[data-oreason]').forEach(b=>b.setAttribute('aria-pressed',b===t))}
  else if(d.thm){settings.theme=d.thm;save();applyAccent();keepScroll(render)}
  else if(d.op){st.op=d.op;if(d.op!=='custom')st.oAt=Date.now();keepScroll(render)}
  else if(d.onav){const x=new Date(st.oAt),n=+d.onav;if(st.op==='day')x.setDate(x.getDate()+n);else if(st.op==='week')x.setDate(x.getDate()+7*n);else x.setMonth(x.getMonth()+n,1);if(x.getTime()<=Date.now()||n<0){st.oAt=Math.min(x.getTime(),Date.now());keepScroll(render)}}
  else if(d.mv){openMove(d.mv)}
  else if('mvall' in d){st.mvAll=1;keepScroll(render)}
  else if(d.stk){openStockEdit(+d.stk)}
  else if(d.pp){st.pp=d.pp;st.pAt=Math.min(st.pAt,Date.now());keepScroll(render)}
  else if(d.pnav){const x=new Date(st.pAt),n=+d.pnav;if(st.pp==='day')x.setDate(x.getDate()+n);else if(st.pp==='week')x.setDate(x.getDate()+7*n);else if(st.pp==='year')x.setFullYear(x.getFullYear()+n,0,1);else x.setMonth(x.getMonth()+n,1);if(n<0||x.getTime()<=Date.now()){st.pAt=Math.min(x.getTime(),Date.now());keepScroll(render)}}
  else if(d.cmon){const x=new Date(st.calM);x.setMonth(x.getMonth()+ +d.cmon,1);if(x.getTime()<=Date.now()){st.calM=x.getTime();keepScroll(render)}}
  else if('hist' in d){openHistory()}
  else if('inhist' in d){openInHistory()}
  else if(d.pmonth){st.pp='month';st.pAt=+d.pmonth;render();scrollTo(0,0)}
  else if(d.accent){settings.accent=d.accent;if(curStyle()!=='none')settings.style='none';save();applyAccent();keepScroll(render)}
  else if(d.style&&t.closest('.styles')){settings.style=d.style;save();applyAccent();keepScroll(render)}
  else if('newprod' in d)openEditor(null);
  else if('scan' in d)scanSell();
  else if(d.restock){openStockMove(+d.restock,'in')}
  else if(d.kf){st.kf=d.kf;keepScroll(render)}
  else if(d.kmv){const [m,i]=d.kmv.split('_');openStockMove(+i,m)}
  else if(d.go){closeSheet();if(d.rtab)st.rtab=d.rtab;if(location.hash==='#'+d.go)render();else location.hash=d.go}
});
$('#scrim').onclick=closeSheet;$('#sheetLeft').onclick=()=>{if(sheetBack)sheetBack();else closeSheet()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
$('#q').oninput=e=>{st.q=e.target.value;keepScroll(render);$('#q').focus()};
$('#billbar').onclick=openBill;
$('#fab').onclick=()=>openCashEntry(null);
const tip=document.createElement('div');tip.className='tip';document.body.appendChild(tip);
const showTip=e=>{const h=e.target.closest?.('[data-tip]');if(!h){tip.classList.remove('on');return}const r=h.getBoundingClientRect();tip.textContent=h.dataset.tip;tip.classList.add('on');const w=tip.offsetWidth;tip.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+'px';tip.style.top=Math.max(8,r.top-34)+'px'};
['pointerover','pointerdown','focusin'].forEach(ev=>document.addEventListener(ev,showTip));
document.addEventListener('scroll',()=>tip.classList.remove('on'),true);
document.addEventListener('click',e=>{const b=e.target.closest('[data-backup],[data-install],[data-snaps],[data-hide]');if(!b)return;
  if(b.dataset.backup!==undefined)backupFile();else if(b.dataset.install!==undefined)openInstall();else if(b.dataset.snaps!==undefined)openSnaps();
  else{settings[b.dataset.hide+'Hide']=Date.now()+(b.dataset.hide==='install'?3:2)*D;save();render()}});
window.addEventListener('hashchange',route);
document.addEventListener('change',e=>{const id=e.target.id,v=e.target.value;if(!v)return;
  if(id==='oPick'){st.oAt=parseD(v);keepScroll(render)}else if(id==='pPick'){st.pAt=parseD(v);keepScroll(render)}else if(id==='oFrom'){st.oFrom=parseD(v);keepScroll(render)}else if(id==='oTo'){st.oTo=parseD(v);keepScroll(render)}});
backfillBuys();applyAccent();route();boot().then(()=>{if(syncCfg)syncStart(syncCfg.code,'resume').catch(e=>{console.warn(e);setSync('error')})});
</script>

<script>if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;let done=false;
navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!done){done=true;location.reload()}});
addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>{const up=()=>r.update().catch(()=>{});setInterval(up,30*60*1000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')up()})}).catch(()=>{}))}</script>
</body>
