<style>
/* Layout: iOS-style app shell. Large title per screen, grouped inset lists, bottom tab bar; sheets slide up from the bottom. Accent is user-selectable. */

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fg:#f4f4f6; --muted:#9a9aa2; --line:#2f2f33;
  --brand-fg:#06140f; --income:#4cd17f; --expense:#ff6b5e; --income-soft:#13301f; --expense-soft:#3a1714; --warn:#f0b75a; --warn-soft:#3a2f18;
  --c1:#36a383; --c2:#b8800f; --c3:#6f8de0; --c4:#d8648a; --c5:#9a78e0; --c6:#7f9f2f; --grid:#2c2c2e;
  --tabbar:rgba(22,22,24,.86); --sheet:#0f0f11; --seg-on:#5a5a5f; --prev:#55555b; --card-shadow:none; --shadow:0 10px 40px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fg:#f4f4f6; --muted:#9a9aa2; --line:#2f2f33;
  --brand-fg:#06140f; --income:#4cd17f; --expense:#ff6b5e; --income-soft:#13301f; --expense-soft:#3a1714; --warn:#f0b75a; --warn-soft:#3a2f18;
  --c1:#36a383; --c2:#b8800f; --c3:#6f8de0; --c4:#d8648a; --c5:#9a78e0; --c6:#7f9f2f; --grid:#2c2c2e;

.av-edit{display:flex;align-items:center;gap:16px;padding:16px}.av-big{width:88px;height:88px;border-radius:24px;overflow:hidden;flex:none;display:grid;place-items:center;font-size:36px;font-weight:800;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 88%,#000),color-mix(in srgb,var(--brand) 52%,#000))}.av-big img{width:100%;height:100%;object-fit:cover;display:block}
.av-btns{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}.av-btns label,.av-btns button{display:flex;align-items:center;justify-content:center;gap:6px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:15px;border:0;cursor:pointer}.av-btns .rm{background:none;color:var(--expense);height:28px;font-weight:600}

.inc{color:var(--income)} .exp{color:var(--expense)}
.big{font-family:var(--f-num);font-weight:700;letter-spacing:-.01em}
.hint{font-size:13px;color:var(--muted)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}

.row{display:flex;justify-content:space-between;gap:10px;align-items:center}

.hero{position:relative;overflow:hidden;color:#fff;border-radius:22px;padding:18px 18px 16px;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 88%,#000),color-mix(in srgb,var(--brand) 52%,#000));box-shadow:0 10px 30px color-mix(in srgb,var(--brand) 30%,transparent);display:flex;flex-direction:column;gap:6px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

.card{position:relative;background:var(--surface);border-radius:16px;box-shadow:var(--card-shadow);transition:box-shadow .15s}

.em{overflow:hidden}

.hero-pic .pimg{border-radius:16px}

.sheet-b>*{flex-shrink:0}
.sync-code{display:flex;gap:16px;align-items:center;padding:12px 16px}.sync-code #syncQR{background:#fff;padding:8px;border-radius:12px;flex:none;line-height:0}.sync-code #syncQR img,.sync-code #syncQR canvas{width:132px;height:132px}.sync-code b{display:block;font-size:17px;letter-spacing:.02em;white-space:nowrap;margin:2px 0 6px}.sync-code>div:last-child{min-width:0}

.sheet.on{transform:none}
.sheet-h{display:grid;grid-template-columns:80px 1fr 80px;align-items:center;padding:14px 12px 10px;position:relative}
.sheet-h::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:5px;border-radius:3px;background:var(--line);transform:translateX(-50%)}
.sheet-h h3{margin:0;text-align:center;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link{border:0;background:none;color:var(--brand);font-weight:600;font-size:16px;padding:6px}
#sheetRight{text-align:right}
.sheet-b{flex:1;overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.sheet-f{padding:12px 16px;border-top:.5px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--sheet)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--muted);padding-left:4px}
.field input,.field textarea,.field select{border:0;background:var(--surface);border-radius:11px;padding:11px 13px;min-height:46px;width:100%}
.field.err input{box-shadow:0 0 0 1.5px var(--expense)}
.field .msg{font-size:12px;color:var(--expense);padding-left:4px}
.field .msg:empty{display:none}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid>*{min-width:0}
.full{grid-column:1/-1}
.check{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:11px;padding:12px 13px;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--brand)}
.sum-row{display:flex;justify-content:space-between}
.sum-row.total{font-size:20px;font-weight:800}
.qr-box{background:#fff;border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#111;text-align:center}
.qr-box .qr{width:200px;height:200px}
.qr-box .qr img,.qr-box .qr canvas{width:200px!important;height:200px!important}
.success{text-align:center;padding:20px 6px;display:flex;flex-direction:column;gap:10px;align-items:center}
.success .ok{width:72px;height:72px;border-radius:50%;background:var(--income-soft);color:var(--income);display:grid;place-items:center;font-size:38px}
.toast{pointer-events:none;position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:60;transition:all .25s;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.month{display:flex;align-items:center;justify-content:space-between}
.month button{border:0;background:var(--surface);width:38px;height:38px;border-radius:50%;color:var(--brand);font-size:22px}
.month strong{font-size:17px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface);border-radius:var(--r);padding:8px;gap:2px}
.cal .dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
.cal .dow.sun{color:var(--expense)}
.cal button{border:0;background:none;border-radius:9px;min-height:54px;padding:4px 1px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.cal button .d{font-size:14px;font-weight:600;width:24px;height:24px;line-height:24px;border-radius:50%}
.cal button .a{font-size:9.5px;font-weight:700;line-height:1.15;max-width:100%;overflow:hidden;white-space:nowrap;font-family:var(--f-num)}
.cal button.today .d{background:var(--brand);color:var(--brand-fg)}
.cal button[aria-pressed="true"]{background:var(--brand-soft)}
.cal button.mute{opacity:.3}
.donut-wrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}

.donut text{font-family:var(--f-num)}
.legend{display:flex;flex-direction:column;gap:8px;font-size:14px;min-width:0;width:100%}

.legend .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:10px;height:10px;border-radius:3px;flex:none}

.amount{background:var(--surface);border-radius:13px;padding:10px 16px;text-align:right;font-size:34px;min-height:62px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.panel{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{margin:0;font-size:17px}

.chart .bar{fill:var(--brand)}
.chart .bar.today{fill:var(--c2)}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:14px}

.hbar .track i{display:block;height:100%;background:var(--brand);border-radius:0 4px 4px 0}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}

.low{color:var(--expense);font-weight:700}

function genOrders(){
  let r=11;const rnd=()=>(r=(r*16807)%2147483647)/2147483647;
  const out=[],d0=dayStart();
  const start=Math.round((d0-new Date(new Date().getFullYear()-1,0,1).getTime())/D);
  for(let d=start;d>=0;d--){const season=(1+.3*Math.sin((new Date(d0-d*D).getMonth()+1)/12*Math.PI*2))*(1+.18*(1-d/start));const n=d>34?Math.round((1.4+rnd()*2.2)*season):2+Math.floor(rnd()*5)-(d===0?1:0);
    const hNow=(Date.now()-d0)/H;for(let k=0;k<n;k++){const at=d===0?(hNow<7?Infinity:d0+(6.5+rnd()*(hNow-6.6))*H):d0-d*D+(7+rnd()*13)*H;if(at>Date.now())continue;
      const items=[],m=d>34?1+Math.floor(rnd()*2):1+Math.floor(rnd()*3);
      for(let j=0;j<m;j++){const id=1+Math.floor(rnd()*21);if(!items.find(i=>i.id===id))items.push({id,qty:1+Math.floor(rnd()*3)})}
      const cid=[0,0,0,1,2,3,4][Math.floor(rnd()*7)]||null;
      let status=rnd()<.04?'cancel':'done';
      if(cid&&d<12&&rnd()<.35)status='new';
      out.push({id:'DH'+String(Math.floor(at/1000)).slice(-6),at,cid,name:cid?SEED_CUST[cid-1].name:'Khách lẻ',pay:['cod','cod','bank','wallet'][Math.floor(rnd()*4)],items,discount:0,status,sample:true})}}
  return out.sort((a,b)=>b.at-a.at);
}

function oRange(){const d=new Date(st.oAt);

  if(st.op==='month')return [new Date(d.getFullYear(),d.getMonth(),1).getTime(),new Date(d.getFullYear(),d.getMonth()+1,1).getTime()];
  if(st.op==='custom'){let a=st.oFrom||dayStart(),b=st.oTo||dayStart();if(a>b)[a,b]=[b,a];const e=new Date(b);return [a,new Date(e.getFullYear(),e.getMonth(),e.getDate()+1).getTime()]}
  return [0,Infinity]}

function vReport(){

function rOverview(){
  if(st.range==='year')return rYear();
  const R=st.range,from=dayStart()-(R-1)*D,inR=orders.filter(o=>o.at>=from&&o.status!=='cancel');
  const rev=inR.reduce((s,o)=>s+orderTotal(o),0),gross=rev-inR.reduce((s,o)=>s+orderCost(o),0);
  const loss=lossIn(from),exp=cash.filter(e=>e.type==='out'&&e.at>=from).reduce((s,e)=>s+e.amount,0)+loss;
  const days=[...Array(R)].map((_,i)=>{const s=dayStart(from+i*D+2*H),os=inR.filter(o=>o.at>=s&&o.at<s+D);return{s,rev:os.reduce((a,o)=>a+orderTotal(o),0),n:os.length}});
  const max=Math.max(1,...days.map(d=>d.rev)),step=[200000,500000,1000000,2000000,5000000].find(s=>max/s<=4)||10000000,top=Math.ceil(max/step)*step;
  const W=420,Hh=190,L=34,B=22,Tp=8,cw=(W-L)/R,bw=Math.min(28,cw*.62),y=v=>Tp+(Hh-Tp-B)*(1-v/top);
  let svg=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Doanh thu theo ngày">`;
  for(let v=0;v<=top;v+=step)svg+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-5}" y="${y(v)+4}" text-anchor="end">${short(v)}</text>`;
  const every=Math.ceil(R/7);

    if(h>0)svg+=`<path class="bar ${isT?'today':''}" pointer-events="none" d="M${x},${y(0)} v${-(h-r)} q0,${-r} ${r},${-r} h${bw-2*r} q${r},0 ${r},${r} v${h-r} z"/>`;

  const sold={};inR.forEach(o=>o.items.forEach(i=>{const p=P(i.id);if(p)sold[i.id]=(sold[i.id]||0)+iPrice(i)*i.qty}));

   <div class="legend">${pays.map(p=>`<div><span class="sw" style="background:${p.c}"></span><span class="n">${PAY[p.k]}</span><span class="num hint">${fmt(p.v)}</span><b class="num">${Math.round(p.v/ptot*100)}%</b></div>`).join('')}</div></div>

function squareImg(file,m,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sz=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=Math.min(m,sz);c.getContext('2d').drawImage(im,(im.width-sz)/2,(im.height-sz)/2,sz,sz,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.85))};im.onerror=()=>toast('Không đọc được ảnh này');im.src=r.result};r.readAsDataURL(file)}
function resizeImg(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=320,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};im.onerror=()=>toast('Không đọc được ảnh này');im.src=r.result};r.readAsDataURL(file)}

const rangeSeg=()=>`<div class="seg">${[[7,'7 ngày'],[30,'30 ngày'],['year','Theo năm']].map(([r,l])=>`<button data-range="${r}" aria-pressed="${r===st.range}">${l}</button>`).join('')}</div>`;
function rYear(){
  const Y=st.year||new Date().getFullYear();st.year=Y;
  const agg=y=>[...Array(12)].map((_,m)=>{const a=new Date(y,m,1).getTime(),b=new Date(y,m+1,1).getTime(),os=orders.filter(o=>o.at>=a&&o.at<b&&o.status!=='cancel');const rev=os.reduce((s,o)=>s+orderTotal(o),0);
    const exp=cash.filter(e=>e.type==='out'&&e.at>=a&&e.at<b).reduce((s,e)=>s+e.amount,0)+lossIn(a,b);return{m,rev,gross:rev-os.reduce((s,o)=>s+orderCost(o),0),exp,n:os.length,future:a>Date.now()}});
  const cur=agg(Y),prev=agg(Y-1),sum=(a,k)=>a.reduce((s,x)=>s+x[k],0);
  const rev=sum(cur,'rev'),prevRev=sum(prev.filter((_,i)=>!cur[i].future),'rev'),gross=sum(cur,'gross'),exp=sum(cur,'exp');
  const diff=prevRev?Math.round((rev-prevRev)/prevRev*100):null;
  const max=Math.max(1,...cur.map(x=>x.rev),...prev.map(x=>x.rev)),step=[1e6,2e6,5e6,1e7,2e7,5e7,1e8].find(s=>max/s<=4)||2e8,top=Math.ceil(max/step)*step;
  const W=420,Hh=210,L=36,B=22,Tp=8,cw=(W-L)/12,bw=Math.min(12,cw*.32),y=v=>Tp+(Hh-Tp-B)*(1-v/top);
  let svg=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Doanh thu 12 tháng năm ${Y} so với ${Y-1}">`;
  for(let v=0;v<=top;v+=step)svg+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-5}" y="${y(v)+4}" text-anchor="end">${short(v)}</text>`;
  const bar=(x,v,cls)=>{const h=y(0)-y(v),r=Math.min(4,h,bw/2);return h>0?`<path class="${cls}" pointer-events="none" d="M${x},${y(0)} v${-(h-r)} q0,${-r} ${r},${-r} h${bw-2*r} q${r},0 ${r},${r} v${h-r} z"/>`:''};
  cur.forEach((c,i)=>{const x0=L+i*cw,cx=x0+cw/2;
    svg+=`<rect x="${x0}" y="${Tp}" width="${cw}" height="${Hh-Tp-B}" fill="transparent" data-tip="Tháng ${i+1}: ${fmt(c.rev)} · năm trước ${fmt(prev[i].rev)}"/>`;
    svg+=bar(cx-bw-1,prev[i].rev,'bar prev')+bar(cx+1,c.rev,'bar');
    svg+=`<text x="${cx}" y="${Hh-5}" text-anchor="middle">T${i+1}</text>`});
  svg+='</svg>';
  const best=cur.reduce((a,b)=>b.rev>a.rev?b:a,cur[0]);
  return `${rangeSeg()}
  <div class="month"><button data-year="-1" aria-label="Năm trước">‹</button><strong>Năm ${Y}</strong><button data-year="1" aria-label="Năm sau" ${Y>=new Date().getFullYear()?'disabled style="opacity:.3"':''}>›</button></div>
  <div class="tiles"><div class="tile"><div class="k">Doanh thu năm</div><div class="v big num">${fmt(rev)}</div>${diff!==null?`<div class="${diff>=0?'inc':'exp'}" style="font-size:13px;font-weight:600">${diff>=0?'▲':'▼'} ${Math.abs(diff)}% so với ${Y-1}</div>`:''}</div><div class="tile"><div class="k">Tiền nhập hàng</div><div class="v big num exp">${fmt(buyIn(new Date(Y,0,1).getTime(),new Date(Y+1,0,1).getTime()))}</div></div><div class="tile"><div class="k">Lời bán hàng</div><div class="v big num inc">${fmt(gross)}</div></div><div class="tile"><div class="k">Chi phí khác</div><div class="v big num exp">${fmt(exp)}</div></div><div class="tile" style="grid-column:1/-1"><div class="k">Lời thực</div><div class="v big num ${gross-exp>=0?'inc':'exp'}">${fmt(gross-exp)}</div></div></div>
  <div class="panel"><div class="row"><h3>Doanh thu 12 tháng</h3></div>
   <div class="legend" style="flex-direction:row;gap:16px"><div><span class="sw" style="background:var(--brand)"></span>${Y}</div><div><span class="sw" style="background:var(--prev)"></span>${Y-1}</div></div>
   <div class="chart">${svg}</div>${best.rev?`<span class="hint">Tháng bán tốt nhất: tháng ${best.m+1}, ${fmt(best.rev)}</span>`:''}</div>
  <div class="group-h">Chi tiết từng tháng</div>
  <div class="group">${cur.filter(c=>!c.future).reverse().map(c=>`<div class="cell"><div class="grow"><div class="t">Tháng ${c.m+1}</div><div class="s">${c.n} đơn · lãi gộp ${fmt(c.gross)} · chi ${fmt(c.exp)}</div></div><div class="r"><div class="big num">${fmt(c.rev)}</div>${prev[c.m].rev?`<div class="s ${c.rev>=prev[c.m].rev?'inc':'exp'}">${c.rev>=prev[c.m].rev?'▲':'▼'} ${Math.abs(Math.round((c.rev-prev[c.m].rev)/prev[c.m].rev*100))}%</div>`:''}</div></div>`).join('')}</div>`;
}

     <div class="field"><label for="cat-name">Tên</label><input id="cat-name" value="${esc(name)}" ${ex?.sys?'disabled':''} placeholder="${kind==='p'?'Ví dụ: Bia rượu':'Ví dụ: Quảng cáo'}"><span class="msg"></span></div>
     <div class="group-h">Màu sắc</div><div class="group"><div class="swatches">${COLORS.map(c=>`<button data-col="${c}" aria-pressed="${c===color}" aria-label="Màu ${c}" style="background:${c}"></button>`).join('')}</div></div>
     <div class="group-h">Biểu tượng</div><div class="icon-grid">${ICONS.map(i=>`<button data-ico="${i}" aria-pressed="${i===icon}">${i}</button>`).join('')}</div>`,
     `<div class="row">${ex&&!ex.sys?'<button class="btn danger" id="catDel">Xóa</button>':''}<button class="btn" id="catSave" style="flex:1">Lưu</button></div>`,'');
    $('#sheetLeft').textContent='Quay lại';sheetBack=()=>back();
    $('#sheetBody').querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{name=$('#cat-name').value;color=b.dataset.col;draw()});
    $('#sheetBody').querySelectorAll('[data-ico]').forEach(b=>b.onclick=()=>{name=$('#cat-name').value;icon=b.dataset.ico;draw()});
    $('#catSave').onclick=()=>{
      const n=$('#cat-name').value.trim();
      if(!setErr('cat-name',n?'':'Nhập tên'))return;
      if(list.some(c=>c!==ex&&norm(c.name)===norm(n)&&(kind==='p'||c.type===kind))){setErr('cat-name','Tên này đã có');return}
      if(ex){const old=ex.name;Object.assign(ex,{name:ex.sys?old:n,icon,color});
        if(!ex.sys&&old!==n){if(kind==='p'){products.forEach(p=>{if(p.cat===old)p.cat=n});if(st.cat===old)st.cat=n}else cash.forEach(e=>{if(e.cat===old)e.cat=n})}}
      else list.push(kind==='p'?{id:'p'+Date.now(),name:n,icon,color}:{id:'c'+Date.now(),type:kind,name:n,icon,color});
      save();render();if(kind==='p'&&!ex&&!done){st.cat=n;render();openEditor(null);toast(`Đã tạo “${n}”. Giờ thêm sản phẩm, nhập giá nhập và giá bán.`);return}toast('Đã lưu');back(n)};
    if(ex&&!ex.sys)$('#catDel').onclick=()=>{
      const used=catUse(kind,ex);
      if(kind==='p'&&used){toast(`Còn ${used} sản phẩm trong danh mục này. Chuyển chúng sang danh mục khác trước.`);return}
      confirmSheet(`Xóa “${esc(ex.name)}”?${used?` ${used} khoản cũ vẫn giữ tên này.`:''}`,'Xóa',()=>{if(kind==='p'){pcats=pcats.filter(c=>c!==ex);if(st.cat===ex.name)st.cat='Tất cả'}else ccats=ccats.filter(c=>c!==ex);save();render();openCatList(kind)})};
  };draw();
}

/* ---------- routing ---------- */
const VIEWS={shop:['Bán hàng',vShop],orders:['Đơn hàng',vOrders],customers:['Khách hàng',vCustomers],cashbook:['Thu chi',vCash],report:['Báo cáo',vReport],settings:['Cài đặt',()=>`<div class="view">${rSettings()}</div>`]};
function render(){
  const [title,fn]=VIEWS[st.view];
  $('#viewTitle').textContent=title;
  $('#searchBox').hidden=!['shop','orders','customers'].includes(st.view);
  $('#q').placeholder={shop:'Tìm sản phẩm, dịch vụ',orders:'Tìm mã đơn, tên khách',customers:'Tìm tên, số điện thoại'}[st.view]||'';
  const t=totals();
  const GEAR=st.view==='settings'?'':`<button class="circle" data-go="settings" aria-label="Cài đặt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>`;
  $('#topActions').innerHTML=GEAR+(st.view==='shop'?`<button class="circle" data-scan aria-label="Quét mã vạch">${SCAN_IC}</button><button class="circle" data-newprod aria-label="Thêm sản phẩm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button><button class="circle" data-bill aria-label="Đơn đang tạo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>${t.count?`<span class="badge num">${t.count}</span>`:''}</button>`
    :st.view==='customers'?`<button class="circle" data-newcust aria-label="Thêm khách hàng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button>`:'');
  $('#app').innerHTML=fn();
  $('#fab').hidden=st.view!=='cashbook';
  document.querySelectorAll('#tabbar a').forEach(a=>a.setAttribute('aria-current',a.dataset.v===st.view?'page':'false'));
  if(st.view==='report'||st.view==='settings')bindReport();
  drawQRs($('#app'));
}
function route(){const h=location.hash.slice(1),v=VIEWS[h]?h:'shop';if(v!==st.view){st.view=v;st.q='';$('#q').value=''}render();renderBill();scrollTo(0,0)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-year],[data-thm],[data-delorder],[data-scan],[data-share],[data-promoedit],[data-smode],[data-oreason],[data-mgr],[data-catedit],[data-catnew],[data-cat],[data-add],[data-inc],[data-dec],[data-open],[data-close],[data-edit],[data-bill],[data-of],[data-order],[data-setst],[data-cust],[data-newcust],[data-editcust],[data-mon],[data-day],[data-cashedit],[data-rt],[data-range],[data-accent],[data-op],[data-onav],[data-style],[data-newprod],[data-restock],[data-go]');
  if(!t)return;const d=t.dataset;
  if(d.mgr)openCatList(d.mgr);
  else if(d.catedit)openCatEditor(d.kind,d.catedit);
  else if(d.catnew)openCatEditor(d.catnew,null);
  else if(d.cat){st.cat=d.cat;keepScroll(render)}
  else if(d.add){const p=P(+d.add);if(!p.service&&p.stock<=0){toast('Sản phẩm đã hết hàng. Vào Kho hàng để nhập thêm.');return}setQty(+d.add,(cart[d.add]||0)+1);t.closest('.card')?.animate?.([{transform:'scale(.96)'},{transform:'scale(1)'}],{duration:180})}
  else if(d.inc)setQty(+d.inc,(cart[d.inc]||0)+1);
  else if(d.dec)setQty(+d.dec,(cart[d.dec]||0)-1);
  else if(d.open)openProduct(+d.open);
  else if('close' in d)closeSheet();
  else if(d.edit)openEditor(+d.edit);
  else if('bill' in d)openBill();
  else if(d.of){st.ofilter=d.of;render()}
  else if(d.setst){const o=orders.find(x=>x.id===d.oid);o.status=d.setst;if(d.setst!=='new')o.debtPaid=false;save();keepScroll(render);openOrder(o.id);toast(`${o.id}: ${STATUS[o.status][0]}`)}
  else if(d.order)openOrder(d.order);
  else if(d.cust)openCustomer(+d.cust);
  else if('newcust' in d)openCustomer(null);
  else if(d.editcust){const c=C(+d.editcust);sheetMode='custedit';openSheet('Sửa khách hàng',custForm(c),`<button class="btn" id="saveCust">Lưu</button>`);bindCustForm(c.id)}
  else if(d.mon){const m=new Date(st.month);m.setMonth(m.getMonth()+ +d.mon);st.month=m.getTime();st.day=Math.min(dayStart(),st.month);render()}
  else if(d.day){st.day=+d.day;keepScroll(render)}
  else if(d.cashedit)openCashEntry(d.cashedit);
  else if(d.rt){st.rtab=d.rt;render()}
  else if(d.range){st.range=d.range==='year'?'year':+d.range;keepScroll(render)}
  else if(d.year){st.year=(st.year||new Date().getFullYear())+ +d.year;keepScroll(render)}
  else if(d.delorder){const o=orders.find(x=>x.id===d.delorder);if(o)deleteOrder(o)}
  else if(d.share){const o=orders.find(x=>x.id===d.share);if(o)shareText(receiptText(o),'Hóa đơn '+o.id)}
  else if(d.promoedit!==undefined){openPromo(+d.promoedit||null)}
  else if(d.smode){st.smode=d.smode;keepScroll(render)}
  else if(d.oreason){st.oreason=d.oreason;document.querySelectorAll('[data-oreason]').forEach(b=>b.setAttribute('aria-pressed',b===t))}
  else if(d.thm){settings.theme=d.thm;save();applyAccent();keepScroll(render)}
  else if(d.op){st.op=d.op;if(d.op!=='custom')st.oAt=Date.now();keepScroll(render)}
  else if(d.onav){const x=new Date(st.oAt),n=+d.onav;if(st.op==='day')x.setDate(x.getDate()+n);else if(st.op==='week')x.setDate(x.getDate()+7*n);else x.setMonth(x.getMonth()+n,1);if(x.getTime()<=Date.now()||n<0){st.oAt=Math.min(x.getTime(),Date.now());keepScroll(render)}}
  else if(d.accent){settings.accent=d.accent;if(curStyle()!=='none')settings.style='none';save();applyAccent();keepScroll(render)}
  else if(d.style&&t.closest('.styles')){settings.style=d.style;save();applyAccent();keepScroll(render)}
  else if('newprod' in d)openEditor(null);
  else if('scan' in d)scanSell();
  else if(d.restock){$('#s-p').value=d.restock;$('#s-p').onchange();$('#s-q').focus()}
  else if(d.go){closeSheet();if(d.rtab)st.rtab=d.rtab;if(location.hash==='#'+d.go)render();else location.hash=d.go}
});
$('#scrim').onclick=closeSheet;$('#sheetLeft').onclick=()=>{if(sheetBack)sheetBack();else closeSheet()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
$('#q').oninput=e=>{st.q=e.target.value;keepScroll(render);$('#q').focus()};
$('#billbar').onclick=openBill;
$('#fab').onclick=()=>openCashEntry(null);
const tip=document.createElement('div');tip.className='tip';document.body.appendChild(tip);
const showTip=e=>{const h=e.target.closest?.('[data-tip]');if(!h){tip.classList.remove('on');return}const r=h.getBoundingClientRect();tip.textContent=h.dataset.tip;tip.classList.add('on');const w=tip.offsetWidth;tip.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+'px';tip.style.top=Math.max(8,r.top-34)+'px'};
['pointerover','pointerdown','focusin'].forEach(ev=>document.addEventListener(ev,showTip));
document.addEventListener('scroll',()=>tip.classList.remove('on'),true);
document.addEventListener('click',e=>{const b=e.target.closest('[data-backup],[data-install],[data-snaps],[data-hide]');if(!b)return;
  if(b.dataset.backup!==undefined)backupFile();else if(b.dataset.install!==undefined)openInstall();else if(b.dataset.snaps!==undefined)openSnaps();
  else{settings[b.dataset.hide+'Hide']=Date.now()+(b.dataset.hide==='install'?3:2)*D;save();render()}});
window.addEventListener('hashchange',route);
document.addEventListener('change',e=>{const id=e.target.id,v=e.target.value;if(!v)return;
  if(id==='oPick'){st.oAt=parseD(v);keepScroll(render)}else if(id==='oFrom'){st.oFrom=parseD(v);keepScroll(render)}else if(id==='oTo'){st.oTo=parseD(v);keepScroll(render)}});
backfillBuys();applyAccent();route();boot().then(()=>{if(syncCfg)syncStart(syncCfg.code,'resume').catch(e=>{console.warn(e);setSync('error')})});
</script>

<script>if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;let done=false;
navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!done){done=true;location.reload()}});
addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>{const up=()=>r.update().catch(()=>{});setInterval(up,30*60*1000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')up()})}).catch(()=>{}))}</script>
</body>
